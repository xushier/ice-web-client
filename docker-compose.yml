services:
  ice-web-client:
    image: ghcr.io/xushier/ice-web-client:latest
    # 本地构建时改用：build: .
    container_name: ice-web-client
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      PORT: '8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
